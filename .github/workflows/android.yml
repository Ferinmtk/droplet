# The Android app (android/): its JVM unit tests (Robolectric, with real TLS on loopback for
# the mesh) and a debug build, on every change to it. Tests that need something outside the
# runner (a hub, a real peer, a TV) skip themselves unless their DROPLET_TEST_* variable is
# set; the mesh interop tests run against the Linux agent from this same commit.
name: android

on:
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - 'agent/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'agent/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # the mesh interop tests talk to real `droplet-agent run --dry-run` processes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the agent for the interop tests
        working-directory: .
        run: |
          python -m venv "$RUNNER_TEMP/agent-venv"
          "$RUNNER_TEMP/agent-venv/bin/pip" install --quiet ./agent
          echo "DROPLET_TEST_AGENT_PY=$RUNNER_TEMP/agent-venv/bin/python" >> "$GITHUB_ENV"

      # the runner has an Android SDK preinstalled ($ANDROID_HOME); the build fetches the
      # platform and build tools it needs
      # DROPLET_SHOTS: ScreensTest renders the screens to PNGs there, for a person to look at
      - name: Unit tests and debug build
        env:
          DROPLET_SHOTS: ${{ runner.temp }}/screens
        run: ./gradlew --no-daemon --stacktrace -PtestHeap=1536m testDebugUnitTest assembleDebug

      - name: Upload the rendered screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screens
          path: ${{ runner.temp }}/screens/
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarise the tests
        if: always()
        working-directory: .
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          rows, total = [], [0, 0, 0, 0]
          for f in sorted(glob.glob("android/app/build/test-results/testDebugUnitTest/*.xml")):
              s = ET.parse(f).getroot()
              n = [int(s.get(k, 0)) for k in ("tests", "failures", "errors", "skipped")]
              total = [a + b for a, b in zip(total, n)]
              rows.append(f"| {s.get('name').rsplit('.', 1)[-1]} | {n[0]} | {n[1] + n[2]} | {n[3]} |")
          print("| test class | tests | failed | skipped |\n|---|---|---|---|")
          print("\n".join(rows))
          print(f"| **all** | {total[0]} | {total[1] + total[2]} | {total[3]} |")
          EOF

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
          retention-days: 14

      - name: Upload the debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: droplet-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
