services:
  droplet:
    build: .
    container_name: droplet
    # host networking so mDNS broadcasts reach the LAN (Linux only)
    network_mode: host
    environment:
      DROPLET_PORT: "8000"
      # DROPLET_PIN: "1234"      # uncomment to require a PIN
      # DROPLET_HTTPS: "1"       # uncomment for HTTPS (self-signed)
      # DROPLET_NAME: "droplet"  # mDNS name -> droplet.local
    volumes:
      # :z relabels the bind mount for SELinux (Fedora/RHEL) — without it
      # the container can't write to ./data and app.py crashes on startup
      # trying to create .secret_key (PermissionError, SELinux denial)
      - ./data:/data:z
    restart: unless-stopped
