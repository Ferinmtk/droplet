<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0f172a">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<title>droplet 💧</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --text:#e2e8f0; --dim:#94a3b8; --accent:#38bdf8; --danger:#f87171; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f1f5f9; --card:#ffffff; --line:#cbd5e1; --text:#0f172a; --dim:#64748b; --accent:#0284c7; --danger:#dc2626; }
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; max-width:640px; margin:0 auto; padding:1.5rem 1rem 3rem; }
  h1 { font-size:1.5rem; margin-bottom:.25rem; display:flex; align-items:center; justify-content:space-between; gap:.5rem; }
  #install { font-size:.8rem; font-weight:500; }
  .sub { color:var(--dim); font-size:.85rem; margin-bottom:1.25rem; }
  #drop { border:2px dashed var(--line); border-radius:12px; padding:2.5rem 1rem; text-align:center;
          color:var(--dim); cursor:pointer; transition:border-color .15s, background .15s; }
  #drop.hover { border-color:var(--accent); color:var(--accent); background:rgba(56,189,248,.08); }
  #bar-wrap { height:6px; background:var(--card); border-radius:3px; margin:.75rem 0 0; overflow:hidden; display:none; }
  #bar { height:100%; width:0; background:var(--accent); transition:width .1s; }
  #bar-text { color:var(--dim); font-size:.78rem; margin-top:.35rem; min-height:1em; }

  details { margin-top:1rem; border:1px solid var(--line); border-radius:10px; background:var(--card); }
  summary { padding:.6rem .8rem; cursor:pointer; font-size:.85rem; color:var(--dim); }
  .text-body { padding:0 .8rem .8rem; }
  textarea { width:100%; min-height:5rem; resize:vertical; background:var(--bg); color:var(--text);
             border:1px solid var(--line); border-radius:8px; padding:.5rem .6rem; font:inherit; font-size:.9rem; }

  button { font:inherit; font-size:.85rem; cursor:pointer; border-radius:8px; border:1px solid var(--line);
           background:var(--card); color:var(--text); padding:.45rem .8rem; }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--bg); font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }

  .toolbar { display:flex; gap:.5rem; margin-top:1.5rem; }
  .toolbar input, .toolbar select { flex:1; font:inherit; font-size:.85rem; background:var(--card); color:var(--text);
                                    border:1px solid var(--line); border-radius:8px; padding:.45rem .6rem; }
  .toolbar select { flex:0 0 auto; }

  #selbar { display:none; align-items:center; gap:.6rem; margin-top:.75rem; padding:.5rem .7rem;
            background:var(--card); border:1px solid var(--accent); border-radius:8px; font-size:.85rem; }
  #selcount { flex:1; color:var(--dim); }

  h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:1.75rem 0 .5rem; }
  ul { list-style:none; }
  li { background:var(--card); border:1px solid var(--line); border-radius:8px; margin-bottom:.4rem;
       display:flex; align-items:center; gap:.15rem; padding-left:.6rem; }
  li.empty { border:none; background:none; color:var(--dim); font-size:.85rem; padding:.4rem .2rem; display:block; }
  li input[type=checkbox] { flex:0 0 auto; width:1.05rem; height:1.05rem; accent-color:var(--accent); }
  li a { flex:1; min-width:0; display:flex; align-items:center; gap:.6rem;
         padding:.6rem .5rem; color:var(--text); text-decoration:none; }
  li a .name { flex:1; min-width:0; word-break:break-all; }
  li a .size { color:var(--dim); font-size:.8rem; white-space:nowrap; }
  li img.thumb { flex:0 0 auto; width:40px; height:40px; object-fit:cover; border-radius:5px;
                 background:var(--bg); border:1px solid var(--line); }
  li .del { flex:0 0 auto; border:none; background:none; color:var(--dim); font-size:1.1rem;
            line-height:1; padding:.5rem .7rem; }
  li .del:hover { color:var(--danger); }
  li a .from { display:block; color:var(--dim); font-size:.75rem; margin-top:.1rem; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:.7rem .8rem;
          margin-bottom:1rem; font-size:.85rem; }
  .card.attn { border-color:var(--accent); }
  .row { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }
  .card input[type=text] { flex:1; min-width:8rem; font:inherit; background:var(--bg); color:var(--text);
                           border:1px solid var(--line); border-radius:8px; padding:.45rem .6rem; }
  .dim { color:var(--dim); }
  .chips { display:flex; flex-wrap:wrap; gap:.4rem; align-items:center; margin-bottom:.6rem; font-size:.85rem; }
  .chip { border-radius:999px; padding:.3rem .75rem; }
  .chip.on { border-color:var(--accent); color:var(--accent); background:rgba(56,189,248,.1); }
  .dot { display:inline-block; width:.5rem; height:.5rem; border-radius:50%; background:var(--line);
         margin-right:.35rem; vertical-align:middle; }
  .dot.online { background:#4ade80; }
  #devices li { padding:.5rem .3rem .5rem .7rem; }
  #devices .dname { flex:1; }
  #chat { margin-top:1rem; }
  #chat-log { max-height:55vh; overflow-y:auto; display:flex; flex-direction:column; gap:.3rem; padding:.5rem 0; }
  .msg { max-width:80%; padding:.45rem .65rem; border-radius:14px; font-size:.9rem; line-height:1.35;
         white-space:pre-wrap; word-break:break-word; cursor:pointer; }
  .msg.mine { align-self:flex-end; background:var(--accent); color:var(--bg); border-bottom-right-radius:4px; }
  .msg.theirs { align-self:flex-start; background:var(--bg); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .msg a { color:inherit; text-decoration:underline; }
  .msg .time { display:block; font-size:.68rem; opacity:.7; text-align:right; margin-top:.15rem; }
  .day { align-self:center; font-size:.72rem; color:var(--dim); margin:.4rem 0 .2rem; }
  #chat-form { flex-wrap:nowrap; align-items:flex-end; }
  #chat-input { flex:1; min-height:2.4rem; max-height:8rem; resize:none; }
  .badge { background:var(--accent); color:var(--bg); border-radius:999px; font-size:.7rem; font-weight:700;
           padding:0 .4rem; margin-left:.35rem; }
  #devices li.pending { border-style:dashed; color:var(--dim); }
  #devices .from { display:block; font-size:.75rem; margin-top:.1rem; word-break:break-all; }
</style>
</head>
<body>
  <h1>💧 droplet <button id="install" hidden>Install app</button></h1>
  <p class="sub">hub: {{ host }}{% if tailnet_user %} · via tailnet as {{ tailnet_user }}{% endif %} — drop a file below to send it here</p>

  <div id="me" class="card" hidden></div>
  <div id="share-choice" class="card attn" hidden></div>
  <div id="targets" class="chips" hidden></div>

  <div id="drop">Drop files here or tap to choose</div>
  <input type="file" id="file" multiple hidden>
  <div id="bar-wrap"><div id="bar"></div></div>
  <p id="bar-text"></p>

  <details id="text-box">
    <summary>Share text</summary>
    <div class="text-body">
      <textarea id="text" placeholder="Paste a link, a note, a wifi password…"></textarea>
      <p style="margin-top:.5rem"><button id="send-text" class="primary">Send text</button>
      <span id="text-status" style="color:var(--dim);font-size:.8rem;margin-left:.5rem"></span></p>
    </div>
  </details>

  <section id="chat" class="card" hidden>
    <b id="chat-with"></b>
    <div id="chat-log"></div>
    <p id="chat-need-name" class="dim" hidden>Name this device (at the top) to chat.</p>
    <div id="chat-form" class="row">
      <textarea id="chat-input" rows="1" placeholder="Message"></textarea>
      <button id="chat-send" class="primary">Send</button>
    </div>
  </section>

  <!-- feature modules mount their cards here (see static/*.js) -->
  <div id="features"></div>

  <div class="toolbar">
    <input id="q" type="search" placeholder="Filter by name…" autocomplete="off">
    <select id="sort">
      <option value="date">Newest first</option>
      <option value="name">Name</option>
      <option value="size">Largest first</option>
    </select>
  </div>

  <div id="selbar">
    <span id="selcount"></span>
    <button id="clearsel">Clear</button>
    <button id="zip" class="primary">Download zip</button>
  </div>

  <h2 id="inbox-h" hidden>For this device</h2>
  <ul id="inbox" hidden></ul>
  <h2>Received</h2>
  <ul id="received"></ul>
  <h2>Shared</h2>
  <ul id="shared"></ul>

  <details id="devices-box" hidden>
    <summary id="devices-sum">Devices</summary>
    <ul id="devices" class="text-body"></ul>
  </details>

<script>
const drop = document.getElementById("drop");
const input = document.getElementById("file");
const barWrap = document.getElementById("bar-wrap");
const bar = document.getElementById("bar");
const barText = document.getElementById("bar-text");
const q = document.getElementById("q");
const sortBy = document.getElementById("sort");
const selbar = document.getElementById("selbar");
const selcount = document.getElementById("selcount");

const selected = new Set();   // "folder/name", kept across auto-refreshes
let latest = { received: [], shared: [], inbox: [], devices: [] };
let me = null;                // this browser's device record, once named
let pushKey = null;           // hub's VAPID public key; null = push is off on the hub
let hubUrl = null;            // the hub's tailnet URL, when it has one

const LS = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let target = LS.get("droplet-target") || "hub";   // where drops and text go

function el(tag, props = {}, ...kids) {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids);
  return e;
}

function ago(ts) {
  const s = Date.now() / 1000 - ts;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}

function fmtSize(b) {
  if (b < 1024) return b + " B";
  const units = ["KB", "MB", "GB"];
  let i = -1;
  do { b /= 1024; i++; } while (b >= 1024 && i < units.length - 1);
  return b.toFixed(b < 10 ? 1 : 0) + " " + units[i];
}

function fmtEta(sec) {
  if (!isFinite(sec) || sec < 0) return "";
  if (sec < 60) return Math.ceil(sec) + "s left";
  return Math.ceil(sec / 60) + "m left";
}

function arrange(files) {
  const needle = q.value.trim().toLowerCase();
  const out = needle ? files.filter(f => f.name.toLowerCase().includes(needle)) : files.slice();
  const how = sortBy.value;
  out.sort((a, b) =>
    how === "name" ? a.name.localeCompare(b.name, undefined, { numeric: true })
    : how === "size" ? b.size - a.size
    : b.mtime - a.mtime);
  return out;
}

function updateSelBar() {
  selbar.style.display = selected.size ? "flex" : "none";
  selcount.textContent = selected.size + (selected.size === 1 ? " file selected" : " files selected");
}

function row(folder, f) {
  const key = `${folder}/${f.name}`;
  const li = document.createElement("li");

  const box = document.createElement("input");
  box.type = "checkbox";
  box.checked = selected.has(key);
  box.onchange = () => { box.checked ? selected.add(key) : selected.delete(key); updateSelBar(); };

  const a = document.createElement("a");
  a.href = `/d/${folder}/${encodeURIComponent(f.name)}`;
  if (f.image) {
    const img = document.createElement("img");
    img.className = "thumb";
    img.loading = "lazy";
    img.src = `/raw/${folder}/${encodeURIComponent(f.name)}`;
    a.appendChild(img);
  }
  const name = document.createElement("span");
  name.className = "name";
  name.textContent = f.name;
  if (f.from) name.append(el("span", { className: "from", textContent: `from ${f.from} · ${ago(f.mtime)}` }));
  const size = document.createElement("span");
  size.className = "size";
  size.textContent = fmtSize(f.size);
  a.append(name, size);

  const del = document.createElement("button");
  del.className = "del";
  del.title = "Delete";
  del.textContent = "×";
  del.onclick = async () => {
    if (!confirm(`Delete ${f.name}?`)) return;
    await fetch(`/delete/${folder}/${encodeURIComponent(f.name)}`, { method: "POST" });
    selected.delete(key);
    updateSelBar();
    refresh();
  };

  li.append(box, a, del);
  return li;
}

function render() {
  document.getElementById("inbox-h").hidden = document.getElementById("inbox").hidden = !me;
  for (const folder of me ? ["inbox", "received", "shared"] : ["received", "shared"]) {
    const ul = document.getElementById(folder);
    ul.innerHTML = "";
    const files = arrange(latest[folder] || []);
    if (!files.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = q.value.trim() ? "nothing matches" : folder === "inbox" ? "nothing waiting for this device" : "nothing yet";
      ul.appendChild(li);
      continue;
    }
    for (const f of files) ul.appendChild(row(folder, f));
  }
  renderTargets();
  renderDevices();
  updateSelBar();
}

let inboxSeen = null;   // names already shown, so only new arrivals get flashed
let lastUnread = {};

async function refresh() {
  const res = await fetch("/api/files").catch(() => null);   // hub briefly unreachable
  if (!res || !res.ok) return;
  latest = await res.json();
  const names = new Set(latest.inbox.map(f => f.name));
  if (inboxSeen) {
    const fresh = latest.inbox.filter(f => !inboxSeen.has(f.name));
    if (fresh.length) flash(`New from ${fresh[0].from || "someone"}: ${fresh.map(f => f.name).join(", ")}`);
  }
  inboxSeen = names;
  const unread = latest.unread || {};
  for (const [id, n] of Object.entries(unread)) {
    if (id !== chatWith && n > (lastUnread[id] || 0)) {
      flash(`New message from ${(others().find(d => d.id === id) || {}).name || "a device"}`);
    }
  }
  lastUnread = unread;
  render();
}

// --- this device: name + notifications ---

async function loadMe() {
  const res = await fetch("/api/me");
  if (!res.ok) return;
  const d = await res.json();
  me = d.device;
  pushKey = d.push_key;
  hubUrl = d.hub_url;
  renderMe(d.suggested);
  if (me) syncPush();
}

function renderMe(suggested) {
  const box = document.getElementById("me");
  box.hidden = false;
  box.innerHTML = "";
  if (!me) {
    const input = el("input", { type: "text", value: suggested || "", maxLength: 40 });
    const save = el("button", { className: "primary", textContent: "Save" });
    save.onclick = () => nameDevice(input.value);
    input.onkeydown = e => { if (e.key === "Enter") nameDevice(input.value); };
    box.append(el("p", { className: "dim", textContent: "Name this device so others can send files straight to it." }),
               el("div", { className: "row", style: "margin-top:.5rem" }, input, save));
    return;
  }
  const r = el("div", { className: "row" }, el("span", {}, "This device: ", el("b", { textContent: me.name })));
  const rename = el("button", { textContent: "Rename" });
  rename.onclick = () => { const n = prompt("Name this device", me.name); if (n && n.trim()) nameDevice(n); };
  r.append(rename);
  if (pushKey && "PushManager" in window && "Notification" in window) {
    if (me.push && Notification.permission === "granted") {
      const test = el("button", { textContent: "Test" });
      test.onclick = async () => { await fetch("/api/push/test", { method: "POST" }); flash("Test sent, it should pop up in a moment"); };
      r.append(el("span", { className: "dim", textContent: "🔔 notifications on" }), test);
    } else if (Notification.permission === "denied") {
      r.append(el("span", { className: "dim", textContent: "🔕 notifications are blocked in this browser's site settings" }));
    } else {
      const on = el("button", { className: "primary", textContent: "Turn on notifications" });
      on.onclick = enablePush;
      r.append(on);
    }
  }
  box.append(r);
}

async function nameDevice(name) {
  name = name.trim();
  if (!name) return;
  const res = await fetch("/api/device", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name }),
  });
  if (res.ok) { await loadMe(); refresh(); return; }
  const err = (await res.json().catch(() => ({}))).error;
  if (!me) await refresh();   // show the Devices list so the old one can be removed
  alert(err || "Couldn't save that name");
}

function b64ToBytes(b64) {
  const s = atob(b64.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - b64.length % 4) % 4));
  return Uint8Array.from(s, c => c.charCodeAt(0));
}

async function subscribe() {
  const reg = await navigator.serviceWorker.ready;
  const key = b64ToBytes(pushKey);
  let sub = await reg.pushManager.getSubscription();
  // a subscription made against a different hub key can't be reused
  const old = sub?.options?.applicationServerKey;
  if (sub && old && new Uint8Array(old).join() !== key.join()) { await sub.unsubscribe(); sub = null; }
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
  const res = await fetch("/api/push/subscribe", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(sub),
  });
  return res.ok;
}

async function enablePush() {
  if (await Notification.requestPermission() === "granted") {
    try {
      if (await subscribe()) { me.push = true; flash("Notifications on"); }
    } catch (e) {
      flash("Couldn't turn on notifications: " + e.message);
    }
  }
  renderMe();
}

// browsers rotate subscriptions now and then; keep the hub's copy current
async function syncPush() {
  if (!pushKey || !("PushManager" in window) || Notification.permission !== "granted") return;
  try {
    if (await subscribe() && !me.push) { me.push = true; renderMe(); }
  } catch {}
}

// --- other devices: send-to picker + list ---

function others() { return (latest.devices || []).filter(d => !d.self); }

function chips(selectedId, onPick) {
  const hub = el("button", { className: "chip" + (selectedId === "hub" ? " on" : ""), textContent: "Hub" });
  hub.onclick = () => onPick("hub");
  const out = [hub];
  for (const d of others()) {
    const c = el("button", {
      className: "chip" + (selectedId === d.id ? " on" : ""),
      title: d.online ? "online" : "offline: it gets it when it's back",
    }, el("span", { className: "dot" + (d.online ? " online" : "") }), d.name);
    const n = (latest.unread || {})[d.id];
    if (n) c.append(el("span", { className: "badge", textContent: n }));
    c.onclick = () => onPick(d.id);
    out.push(c);
  }
  return out;
}

function targetName() {
  return target === "hub" ? "the hub" : (others().find(d => d.id === target) || {}).name;
}

function renderTargets() {
  const box = document.getElementById("targets");
  const list = others();
  if (target !== "hub" && !list.some(d => d.id === target)) target = "hub";
  box.hidden = false;
  box.innerHTML = "";
  if (list.length) {
    box.append(el("span", { className: "dim", textContent: "Send to" }),
               ...chips(target, id => { target = id; LS.set("droplet-target", id); renderTargets(); }));
  } else {
    box.append(el("span", { className: "dim", textContent: "Other devices show up here once droplet is opened on them and given a name." }));
  }
  drop.textContent = list.length ? `Drop files here or tap to choose (to ${targetName()})` : "Drop files here or tap to choose";
  renderChatMode();
}

// --- chat with the selected device ---

let chatWith = null;   // device id whose thread is showing
let chatLast = null;   // id of the newest message rendered, to skip no-op redraws

function renderChatMode() {
  const dev = target !== "hub" && others().find(d => d.id === target);
  document.getElementById("text-box").hidden = !!dev;
  document.getElementById("chat").hidden = !dev;
  if (!dev) { chatWith = null; return; }
  document.getElementById("chat-with").textContent = `Chat with ${dev.name}`;
  document.getElementById("chat-form").hidden = !me;
  document.getElementById("chat-need-name").hidden = !!me;
  if (chatWith !== dev.id) {
    chatWith = dev.id;
    chatLast = null;
    document.getElementById("chat-log").innerHTML = "";
    loadChat();
  }
}

function linkify(text) {
  const span = el("span");
  const re = /https?:\/\/[^\s<]+/g;
  let i = 0, m;
  while ((m = re.exec(text))) {
    span.append(text.slice(i, m.index), el("a", { href: m[0], textContent: m[0], target: "_blank", rel: "noopener noreferrer" }));
    i = m.index + m[0].length;
  }
  span.append(text.slice(i));
  return span;
}

async function loadChat() {
  if (!chatWith || !me) return;
  const id = chatWith;
  const res = await fetch(`/api/chat/${id}`).catch(() => null);
  if (!res || !res.ok || id !== chatWith) return;
  const { messages } = await res.json();
  const newest = messages.length ? messages[messages.length - 1].id : "";
  if (newest === chatLast) return;
  chatLast = newest;
  const log = document.getElementById("chat-log");
  log.innerHTML = "";
  if (!messages.length) log.append(el("p", { className: "dim", textContent: "No messages yet. Say hi 👋" }));
  let lastDay = "";
  for (const m of messages) {
    const d = new Date(m.ts * 1000);
    if (d.toDateString() !== lastDay) {
      lastDay = d.toDateString();
      log.append(el("div", { className: "day", textContent: lastDay === new Date().toDateString() ? "Today" : d.toLocaleDateString() }));
    }
    const b = el("div", { className: "msg " + (m.from === me.id ? "mine" : "theirs"), title: "Tap to copy" },
      linkify(m.text), el("span", { className: "time", textContent: d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) }));
    b.onclick = e => {
      if (e.target.tagName === "A") return;
      navigator.clipboard?.writeText(m.text).then(() => flash("Copied"), () => {});
    };
    log.append(b);
  }
  log.scrollTop = log.scrollHeight;
  if ((latest.unread || {})[id]) { delete latest.unread[id]; renderTargets(); }
}

async function sendChat() {
  const input = document.getElementById("chat-input");
  const text = input.value.trim();
  if (!text || !chatWith) return;
  const body = new FormData();
  body.append("text", text);
  body.append("to", chatWith);
  const res = await fetch("/text", { method: "POST", body }).catch(() => null);
  if (res && res.ok) {
    input.value = "";
    input.style.height = "";
    loadChat();
  } else {
    flash((res && (await res.json().catch(() => ({}))).error) || "Didn't send, is the hub reachable?");
  }
}

// deep link from a notification: /#chat-<device id>
function openFromHash() {
  const m = location.hash.match(/^#chat-([0-9a-f]+)$/);
  if (!m || !others().some(d => d.id === m[1])) return;
  target = m[1];
  LS.set("droplet-target", target);
  history.replaceState(null, "", location.pathname);
  renderTargets();
  document.getElementById("chat").scrollIntoView({ block: "start" });
}

function renderDevices() {
  const list = latest.devices || [];
  const pending = latest.tailnet || [];
  const ul = document.getElementById("devices");
  document.getElementById("devices-box").hidden = !list.length && !pending.length;
  document.getElementById("devices-sum").textContent = "Devices" + (pending.length ? ` · ${pending.length} not set up` : "");
  ul.innerHTML = "";
  for (const d of list) {
    const del = el("button", { className: "del", title: "Remove device", textContent: "×" });
    del.onclick = async () => {
      if (!confirm(`Remove ${d.name}? Anything waiting for it is deleted.`)) return;
      await fetch(`/api/device/${d.id}/remove`, { method: "POST" });
      if (d.self) location.reload(); else refresh();
    };
    ul.append(el("li", {},
      el("span", { className: "dname" }, el("span", { className: "dot" + (d.online ? " online" : "") }),
         d.name + (d.self ? " (this device)" : "") + (d.push ? " 🔔" : "")),
      del));
  }
  const osName = { windows: "Windows", android: "Android", linux: "Linux", macOS: "Mac", iOS: "iPhone/iPad" };
  for (const p of pending) {
    ul.append(el("li", { className: "pending" },
      el("span", { className: "dname" }, el("span", { className: "dot" + (p.online ? " online" : "") }),
         p.node, el("span", { className: "from",
           textContent: `${osName[p.os] || p.os}${p.online ? "" : " · offline"} · not set up: open ${hubUrl || "this page"} on it` }))));
  }
}

function upload(files, to = target) {
  if (!files.length) return Promise.resolve(true);
  return new Promise(resolve => {
  const form = new FormData();
  for (const f of files) form.append("files", f);
  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/upload?to=" + encodeURIComponent(to));
  barWrap.style.display = "block";
  const started = Date.now();
  xhr.upload.onprogress = e => {
    if (!e.lengthComputable) return;
    const pct = e.loaded / e.total * 100;
    bar.style.width = pct + "%";
    const elapsed = (Date.now() - started) / 1000;
    const eta = elapsed > 0.5 ? fmtEta((e.total - e.loaded) / (e.loaded / elapsed)) : "";
    barText.textContent = `${Math.round(pct)}% · ${fmtSize(e.loaded)} of ${fmtSize(e.total)}${eta ? " · " + eta : ""}`;
  };
  xhr.onload = xhr.onerror = () => {
    bar.style.width = "0";
    barWrap.style.display = "none";
    barText.textContent = "";
    refresh();
    resolve(xhr.status === 200);
  };
  xhr.send(form);
  });
}

function flash(msg) {
  barText.textContent = msg;
  setTimeout(() => { if (barText.textContent === msg) barText.textContent = ""; }, 4000);
}

// Items shared from another app wait in the service worker's inbox cache
// until this page uploads them, so a PIN login in between doesn't lose them.
// With other devices around, the user picks where shared items go.
async function drainInbox() {
  if (!("caches" in window) || !(await caches.has("droplet-share-inbox"))) return;
  const cache = await caches.open("droplet-share-inbox");
  const keys = await cache.keys();
  if (!keys.length) return;
  if (!others().length) return sendParked(cache, keys, "hub");
  const box = document.getElementById("share-choice");
  const discard = el("button", { textContent: "Discard" });
  discard.onclick = async () => { for (const k of keys) await cache.delete(k); box.hidden = true; };
  box.innerHTML = "";
  box.append(el("p", { textContent: `${keys.length} shared item(s). Send to:`, style: "margin-bottom:.5rem" }),
             el("div", { className: "chips" }, ...chips(null, to => sendParked(cache, keys, to)), discard));
  box.hidden = false;
  box.scrollIntoView({ block: "nearest" });
}

async function sendParked(cache, keys, to) {
  document.getElementById("share-choice").hidden = true;
  const files = [], fileKeys = [];
  for (const key of keys) {
    const res = await cache.match(key);
    if (!res) continue;
    if (res.headers.get("X-Kind") === "text") {
      const body = new FormData();
      body.append("text", await res.text());
      body.append("to", to);
      if ((await fetch("/text", { method: "POST", body })).ok) await cache.delete(key);
    } else {
      const name = decodeURIComponent(res.headers.get("X-Name") || "shared");
      files.push(new File([await res.blob()], name));
      fileKeys.push(key);
    }
  }
  if (await upload(files, to)) for (const key of fileKeys) await cache.delete(key);
  const left = (await cache.keys()).length;
  const where = to === "hub" ? "the hub" : (others().find(d => d.id === to) || {}).name;
  flash(left ? `${left} shared item(s) didn't send, they'll retry next time` : `Sent ${keys.length} item(s) to ${where}`);
}

document.getElementById("send-text").onclick = async () => {
  const box = document.getElementById("text");
  const status = document.getElementById("text-status");
  if (!box.value.trim()) return;
  const body = new FormData();
  body.append("text", box.value);
  body.append("to", target);
  const res = await fetch("/text", { method: "POST", body });
  if (res.ok) {
    box.value = "";
    status.textContent = "sent";
    setTimeout(() => (status.textContent = ""), 2000);
    refresh();
  } else {
    status.textContent = "failed";
  }
};

document.getElementById("zip").onclick = async () => {
  const btn = document.getElementById("zip");
  btn.disabled = true;
  try {
    const res = await fetch("/zip", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ files: [...selected] }),
    });
    if (!res.ok) return;
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "droplet.zip";
    a.click();
    URL.revokeObjectURL(url);
  } finally {
    btn.disabled = false;
  }
};

document.getElementById("clearsel").onclick = () => { selected.clear(); render(); };

q.oninput = render;
sortBy.onchange = render;

drop.onclick = () => input.click();
input.onchange = () => { upload(input.files); input.value = ""; };
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("hover"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("hover"); }));
drop.addEventListener("drop", e => upload(e.dataTransfer.files));

// service worker = installable app + "Share → droplet" (HTTPS or localhost only)
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");

let installPrompt = null;
const installBtn = document.getElementById("install");
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installPrompt = e; installBtn.hidden = false; });
installBtn.onclick = async () => { installBtn.hidden = true; await installPrompt?.prompt(); installPrompt = null; };
window.addEventListener("appinstalled", () => { installBtn.hidden = true; });

const params = new URLSearchParams(location.search);
if (params.has("shared")) {
  history.replaceState(null, "", "/");
  const n = Number(params.get("shared"));
  if (n) flash(`Shared ${n} item(s) to the hub`);  // server fallback path
}

const chatInput = document.getElementById("chat-input");
document.getElementById("chat-send").onclick = sendChat;
chatInput.addEventListener("input", () => { chatInput.style.height = ""; chatInput.style.height = chatInput.scrollHeight + "px"; });
chatInput.addEventListener("keydown", e => {
  // Enter sends on a keyboard; on touch screens Enter is a newline and the button sends
  if (e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer: coarse)").matches) { e.preventDefault(); sendChat(); }
});
window.addEventListener("hashchange", openFromHash);
setInterval(() => { if (chatWith && !document.hidden) loadChat(); }, 2000);

loadMe().then(refresh).then(() => { openFromHash(); drainInbox(); });
setInterval(refresh, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
