[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
license = "GPL-3.0-or-later"
name = "droplet-agent"
dynamic = ["version"]
description = "Lets your other devices control this Linux computer through droplet"
readme = "README.md"
requires-python = ">=3.9"
# websockets and jeepney are pure Python. zeroconf (finding the hub on the
# LAN) has wheels for the usual platforms and builds without a compiler
# elsewhere, as pure Python. cryptography makes the mesh's key and
# certificate and checks pairing signatures; it has wheels for x86-64 and
# ARM64 Linux (glibc and musl).
dependencies = [
    "websockets>=15.0",
    "jeepney>=0.8",
    "zeroconf>=0.132",
    "cryptography>=42.0",
]

[project.optional-dependencies]
# Droplet's window (`droplet-agent app`). Only Qt's essential modules: Core, Gui, Widgets,
# Network (one window at a time) and DBus (showing a file in the file manager).
app = ["PySide6-Essentials>=6.6"]
# The iPhone link (docs/iphone.md): aiortc for DTLS and SCTP data channels, segno to draw
# the QR code. aiortc also pulls in PyAV (FFmpeg, ~100 MB) for media it never uses here;
# the light way skips it, and the agent runs without it:
#   pip install segno && pip install --no-deps aiortc && pip install aioice pyee pylibsrtp pyopenssl google-crc32c
iphone = ["aiortc>=1.9", "segno>=1.5"]

[project.scripts]
droplet-agent = "droplet_agent.cli:main"

[tool.setuptools]
packages = ["droplet_agent", "droplet_agent.app", "droplet_agent.inject", "droplet_agent.mesh",
            "droplet_agent.webrtc"]

[tool.setuptools.package-data]
# the tray icon's pixels, made by tools/make_tray_icon.py (agent_dist.py ships it too)
droplet_agent = ["tray_icon.bin"]

[tool.setuptools.dynamic]
version = { attr = "droplet_agent.__version__" }
