[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
license = "GPL-3.0-or-later"
name = "droplet-agent"
dynamic = ["version"]
description = "Lets your other devices control this computer (Linux or macOS) through droplet"
readme = "README.md"
requires-python = ">=3.9"
# websockets and jeepney are pure Python. zeroconf (finding the hub on the
# LAN) has wheels for the usual platforms and builds without a compiler
# elsewhere, as pure Python. cryptography makes the mesh's key and
# certificate and checks pairing signatures; it has wheels for x86-64 and
# ARM64 Linux (glibc and musl).
dependencies = [
    "websockets>=15.0",
    "jeepney>=0.8",
    "zeroconf>=0.132",
    "cryptography>=42.0",
]

[project.optional-dependencies]
# Droplet's window (`droplet-agent app`), and on a Mac the menu bar icon. Only Qt's essential
# modules: Core, Gui, Widgets, Network (one window at a time) and DBus (showing a file in the
# file manager). On macOS nothing else is needed: remote control, the clipboard's change count
# and the permission checks call the system frameworks through ctypes.
app = ["PySide6-Essentials>=6.6"]

[project.scripts]
droplet-agent = "droplet_agent.cli:main"

[tool.setuptools]
packages = ["droplet_agent", "droplet_agent.app", "droplet_agent.inject", "droplet_agent.mesh"]

[tool.setuptools.package-data]
# the tray icon's pixels, made by tools/make_tray_icon.py, and the 512 px drop for Droplet.app
# on a Mac (static/icon-512.png); agent_dist.py ships them too
droplet_agent = ["tray_icon.bin", "app_icon.png"]

[tool.setuptools.dynamic]
version = { attr = "droplet_agent.__version__" }
