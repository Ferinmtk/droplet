[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
license = "GPL-3.0-or-later"
name = "droplet-agent"
dynamic = ["version"]
description = "Lets your other devices control this Linux computer through droplet"
readme = "README.md"
requires-python = ">=3.9"
# websockets and jeepney are pure Python. zeroconf (finding the hub on the
# LAN) has wheels for the usual platforms and builds without a compiler
# elsewhere, as pure Python.
dependencies = [
    "websockets>=15.0",
    "jeepney>=0.8",
    "zeroconf>=0.132",
]

[project.scripts]
droplet-agent = "droplet_agent.cli:main"

[tool.setuptools]
packages = ["droplet_agent", "droplet_agent.inject"]

[tool.setuptools.dynamic]
version = { attr = "droplet_agent.__version__" }
